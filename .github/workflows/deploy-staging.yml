name: Deploy staging.clista.ai

# Deploy every app-touching pull request to the staging Worker
# (clista-ai-app-staging @ staging.clista.ai). Monorepo port of the old
# clista-ai-app workflow — same fail-closed Access gate: refuses to deploy
# while env.staging.vars.ACCESS_AUD is empty in app/wrangler.jsonc.
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/**'
      - 'app/worker/**'
      - 'app/index.html'
      - 'app/vite.config.js'
      - 'app/wrangler.jsonc'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      # Fail-closed gate: no staging deploy until its Access app exists and its
      # AUD is committed. Skipping (not failing) keeps unrelated PRs green.
      - name: Check staging Access is configured
        id: gate
        run: |
          AUD="$(node -e "
            const raw = require('fs').readFileSync('wrangler.jsonc', 'utf8');
            const cfg = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ''));
            process.stdout.write(cfg.env?.staging?.vars?.ACCESS_AUD || '');
          ")"
          if [ -z "$AUD" ]; then
            echo "::warning::Staging not deployed: env.staging.vars.ACCESS_AUD is empty in app/wrangler.jsonc."
            echo "**Staging skipped** — no Access app configured for staging.clista.ai yet." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Cloudflare secrets
        if: steps.gate.outputs.configured == 'true'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets."
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        if: steps.gate.outputs.configured == 'true'

      - name: Engine parity tests
        if: steps.gate.outputs.configured == 'true'
        run: npm test

      - name: Build SPA
        if: steps.gate.outputs.configured == 'true'
        run: npm run build

      - name: Deploy staging Worker
        if: steps.gate.outputs.configured == 'true'
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Staging URL
        if: steps.gate.outputs.configured == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Deployed to **https://staging.clista.ai** (PR #${PR_NUMBER:-manual} @ ${GITHUB_SHA:0:8})" >> "$GITHUB_STEP_SUMMARY"
