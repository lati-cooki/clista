name: Deploy staging.clista.ai

# Deploy every app-touching pull request to the staging Worker
# (clista-ai-app-staging @ staging.clista.ai) so changes can be seen live
# before they merge to main and hit production. Staging is a separate Worker
# with its own Durable Objects — thread data there is disposable.
#
# One shared staging environment: the most recent PR push wins (concurrency
# below cancels superseded deploys). Production deploys are untouched —
# deploy-app.yml still runs only on pushes to main.
#
# Gate: refuses to deploy while env.staging.vars.ACCESS_AUD is empty in
# wrangler.jsonc, so staging can never go up publicly without a Cloudflare
# Access app in front of it (docs/DEPLOY.md §7).

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'index.html'
      - 'vite.config.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Fail-closed gate: no staging deploy until its Access app exists and its
      # AUD is committed. Skipping (not failing) keeps unrelated PRs green.
      - name: Check staging Access is configured
        id: gate
        run: |
          AUD="$(node -e "
            const raw = require('fs').readFileSync('wrangler.jsonc', 'utf8');
            const cfg = JSON.parse(raw.replace(/^\s*\/\/.*$/gm, ''));
            process.stdout.write(cfg.env?.staging?.vars?.ACCESS_AUD || '');
          ")"
          if [ -z "$AUD" ]; then
            echo "::warning::Staging not deployed: env.staging.vars.ACCESS_AUD is empty in wrangler.jsonc. Create the Access app for staging.clista.ai (docs/DEPLOY.md §7) and commit its AUD."
            echo "**Staging skipped** — no Access app configured for staging.clista.ai yet (docs/DEPLOY.md §7)." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require Cloudflare secrets
        if: steps.gate.outputs.configured == 'true'
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets (see docs/DEPLOY.md §5)."
            exit 1
          fi

      - uses: actions/setup-node@v5
        if: steps.gate.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.gate.outputs.configured == 'true'

      - name: Engine parity tests
        if: steps.gate.outputs.configured == 'true'
        run: npm test

      - name: Build SPA
        if: steps.gate.outputs.configured == 'true'
        run: npm run build

      - name: Deploy staging Worker
        if: steps.gate.outputs.configured == 'true'
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Staging URL
        if: steps.gate.outputs.configured == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "Deployed to **https://staging.clista.ai** (PR #${PR_NUMBER:-manual} @ ${GITHUB_SHA:0:8})" >> "$GITHUB_STEP_SUMMARY"
