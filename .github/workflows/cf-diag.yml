name: CF secrets diagnostic

# TEMPORARY — verifies the Cloudflare secrets without revealing them:
# value lengths (catches stray whitespace), token verify endpoint, and
# whether the account resolves for this token. Delete after cutover.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Shape check (lengths only, values never printed)
        env:
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "ACCOUNT_ID length: ${#ACCT} (expected 32)"
          echo "API_TOKEN length: ${#TOK} (expected ~40)"
          if [ "$ACCT" != "$(printf %s "$ACCT" | tr -d '[:space:]')" ]; then echo "::error::ACCOUNT_ID contains whitespace"; fi
          if [ "$TOK" != "$(printf %s "$TOK" | tr -d '[:space:]')" ]; then echo "::error::API_TOKEN contains whitespace"; fi

      - name: Token verify
        env:
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -s https://api.cloudflare.com/client/v4/user/tokens/verify \
            -H "Authorization: Bearer $TOK" |
            node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d);console.log('token valid:',j.success,'status:',j.result?.status||'-','errors:',JSON.stringify(j.errors))})"

      - name: Account visibility for this token
        env:
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CODE=$(curl -s -o /tmp/acct.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT" \
            -H "Authorization: Bearer $TOK")
          echo "GET /accounts/<id> -> HTTP $CODE"
          node -e "const j=require('/tmp/acct.json');console.log('success:',j.success,'errors:',JSON.stringify(j.errors))" || true

      - name: Workers services list for this token
        env:
          ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOK: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          CODE=$(curl -s -o /tmp/svc.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/services" \
            -H "Authorization: Bearer $TOK")
          echo "GET /accounts/<id>/workers/services -> HTTP $CODE"
          node -e "const j=require('/tmp/svc.json');console.log('success:',j.success,'errors:',JSON.stringify(j.errors),'services:',(j.result||[]).length)" || true
