name: Sync ClisTa engine

# Re-vendor worker/engine/ from lati-club/ClisTa-Protocol. The engine is the
# app's trust anchor, so upstream changes never auto-deploy — this workflow
# opens a PR when the vendored engine drifts, and a human reviews it. Merging
# the PR (touching worker/**) then triggers deploy-app.yml.
#
# Runs weekly, on manual dispatch (optionally pinning a ref), or when the
# protocol repo pings us via repository_dispatch {type: clista-protocol-release}.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "ClisTa-Protocol git ref (tag/branch/sha). Blank = latest release tag."
        required: false
        default: ""
  repository_dispatch:
    types: [clista-protocol-release]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Match deploy-app.yml (Node 22). The `npm test` script runs
          # `node --test 'test/*.test.js'`, whose glob is expanded by the test
          # runner — support landed in Node 21+. On Node 20 the pattern is taken
          # literally ("Could not find 'test/*.test.js'") and the parity step
          # fails before the drift PR can open.
          node-version: 22
          cache: npm

      - name: Clone ClisTa-Protocol (public)
        run: |
          git clone --quiet https://github.com/lati-club/ClisTa-Protocol.git ../ClisTa-Protocol
          REF="${{ github.event.inputs.ref || github.event.client_payload.ref }}"
          if [ -z "$REF" ]; then
            REF="$(git -C ../ClisTa-Protocol describe --tags --abbrev=0 2>/dev/null || echo main)"
          fi
          git -C ../ClisTa-Protocol checkout --quiet "$REF"
          echo "SYNCED_REF=$REF" >> "$GITHUB_ENV"
          echo "SYNCED_SHA=$(git -C ../ClisTa-Protocol rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - run: npm ci

      # Re-vendor. Exits non-zero (fails the run) if an adapted port drifted
      # upstream and needs a manual re-port — that is the intended signal.
      - name: Re-vendor engine
        run: node scripts/vendor-engine.mjs --from ../ClisTa-Protocol

      - name: Parity test (engine replays identically to the CLI)
        run: npm test

      # First-party PR-on-drift (git + gh with the workflow token). The org
      # Actions policy allows GitHub-owned actions only, so no create-pull-request
      # action here. Force-push keeps the sync branch a clean single commit on
      # re-runs; `gh pr create` is skipped if the PR is already open.
      - name: Open PR on drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add worker/engine
          if git diff --cached --quiet; then
            echo "No engine drift."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B sync/clista-engine
          git commit -m "Sync ClisTa engine from upstream ($SYNCED_REF @ $SYNCED_SHA)"
          git push -f origin sync/clista-engine
          if gh pr list --head sync/clista-engine --state open --json number --jq length | grep -qx 0; then
            gh pr create --base main --head sync/clista-engine \
              --title "Sync ClisTa engine from upstream ($SYNCED_REF)" \
              --label engine-sync \
              --body "$(cat <<EOF
          Automated re-vendor of \`worker/engine/\` from
          **lati-club/ClisTa-Protocol@$SYNCED_REF** (\`$SYNCED_SHA\`).

          - Verbatim modules copied from upstream \`src/\`.
          - Hand-adapted ports (\`integrity.js\`, \`events.js\`) left untouched and guarded.
          - Parity test passed (engine replays identically to the CLI).

          **Trust anchor — review the engine diff before merging.** Merging
          (touches \`worker/**\`) triggers \`deploy-app.yml\` → app.clista.ai.
          EOF
          )"
          else
            echo "PR already open for sync/clista-engine — branch updated."
          fi
