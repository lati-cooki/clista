name: Tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  js:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite (the hub store) and the built-in test runner need >= 22.
          node-version: "22"

      # Zero npm dependencies, so there is nothing to install — run the suite,
      # which includes the in-process-hub end-to-end tests (octopus.test.js,
      # octopus-cli.test.js, hardening.test.js).
      - name: Run tests
        run: npm test
